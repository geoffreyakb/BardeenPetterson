[Grid]
X1-grid         1   1.0                     16       l    30.0
X2-grid         1   0.0                     16       u    3.1415926535897932
X3-grid         1   0.0                     16       u    6.2831853071795864

[TimeIntegrator]
CFL             0.5
tstop           6400.1
nstages         3

[Hydro]
solver          hllc
csiso           userdef
viscosity       explicit  userdef

[Gravity]
potential       userdef

[Boundary]
X1-beg          outflow
X1-end          outflow
X2-beg          axis
X2-end          axis
X3-beg          periodic
X3-end          periodic

[Setup]
epsilon             0.05
alpha               1.0e-3
densityFloor        1e-9
gravity             Einstein
tilt                10
spin                0.5

[Output]
vtk             10
vtk_dir         output/vtk
dmp             100.0
dmp_dir         output/dmp
log             100
analysis        1.0
