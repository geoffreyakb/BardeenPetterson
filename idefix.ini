[Grid]
X1-grid         1   5.0     256        l    50.0
X2-grid         1   0.0     512        u    3.1415926535897932
X3-grid         1   0.0     256        u    6.2831853071795864
coarsening      static      X3

[TimeIntegrator]
CFL             0.5
tstop           12500.1
max_runtime     1.0
nstages         3

[Hydro]
solver          hllc
csiso           userdef
viscosity       explicit  userdef

[Gravity]
potential    userdef

[Boundary]
X1-beg          outflow
X1-end          outflow
X2-beg          axis
X2-end          axis
X3-beg          periodic
X3-end          periodic

[Setup]
epsilon             0.08
alpha               0.022
densityFloor        1e-10
gravity             Kepler
tilt                10
spin                1.0

[Output]
uservar         InvDt
vtk             10.0
vtk_dir         output/vtk
dmp             100.0
dmp_dir         output/dmp
log             100
analysis        1.0
