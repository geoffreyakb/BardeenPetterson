[Grid]
X1-grid         1   4.0                     512       l    40.0
X2-grid         1   0.0                     512       u    3.1415926535897932

[TimeIntegrator]
CFL             0.5
tstop           3200.1
nstages         3

[Hydro]
solver          hllc
csiso           userdef
viscosity       explicit  userdef

[Gravity]
potential       userdef

[Boundary]
X1-beg          userdef
X1-end          userdef
X2-beg          axis
X2-end          axis

[Setup]
epsilon             0.05
alpha               1.0e-3
densityFloor        1e-9
gravity             Kepler
tilt                0
spin                1.0

[Output]
vtk             10
vtk_dir         output/vtk
dmp             100.0
dmp_dir         output/dmp
log             100
analysis        1.0
